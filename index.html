<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SALIOU JOB BUSINESS</title>
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5132">
<style>
:root{--bg:#fff;--g:#1a5632;--o:#b5560b;--y:#8a7a1e;--r:#9b1c1c;--card:#fff;--ink:#0b1a10;--mut:#3d4f43;--line:#1a5632;--navy:#1a5632;--navy2:#b5560b;--ok:#0f7b4f;--ko:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:700 17px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:238px;background:var(--navy);color:#fff;overflow:auto;padding:env(safe-area-inset-top,0px) 0 12px;z-index:20;transition:transform .2s}
aside h1{font:700 17px/1.2 Georgia,serif;margin:0;padding:18px 16px 14px;border-bottom:1px solid #ffffff26;letter-spacing:.3px}
aside h1 small{display:block;font:12px "Segoe UI",sans-serif;color:#c3e0cc;margin-top:3px}
aside a{display:block;color:#e0f0e5;text-decoration:none;padding:9px 16px;border-left:3px solid transparent;cursor:pointer}
aside a:hover{background:#ffffff14}aside a.on{background:#ffffff1f;color:#fff;border-left-color:#fff;font-weight:800}
main{margin-left:238px;padding:20px 22px 40px;max-width:1200px}
.top{display:none;position:sticky;top:0;background:var(--navy);color:#fff;padding:10px 14px;z-index:15;align-items:center;gap:10px}
.top button{background:none;border:0;color:#fff;font-size:22px}
h2{margin:0 0 16px;font:700 30px Georgia,serif;color:var(--navy)}
.card{background:var(--card);border:2px solid var(--navy);border-radius:8px;padding:14px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp div{background:var(--card);border:2px solid var(--navy);border-top:7px solid var(--navy);border-radius:6px;padding:12px}
.kp b{display:block;font-size:26px;margin-top:2px}.kp span{color:#111;font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{font:inherit;padding:10px 12px;border:2px solid var(--navy);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.bar input{width:240px;max-width:100%}
button{font:inherit;cursor:pointer}
.b,.b2,.sm{border-radius:6px;padding:10px 16px;border:2px solid var(--navy);font-weight:700}
.b{background:var(--navy);color:#fff}.b2,.sm{background:var(--card);color:var(--navy)}.sm{padding:4px 9px;font-size:14px;margin-right:4px}.sm.r{color:var(--ko);border-color:var(--ko)}
.b2.r{color:var(--ko);border-color:var(--ko)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px;border:2px solid var(--navy)}
th{background:var(--navy);color:#fff;text-align:left;padding:11px 12px;font-weight:700;white-space:nowrap;border:1px solid var(--navy)}
td{padding:10px 12px;border:1px solid var(--navy)}tr:hover td{background:#b5560b0d}
.tg{padding:2px 8px;border-radius:10px;font-size:12px;background:#b5560b20;color:var(--navy2)}.tg.ok{background:#0f7b4f22;color:var(--ok)}.tg.ko{background:#b4231620;color:var(--ko)}
.md{position:fixed;inset:0;background:#0b1a10b0;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto;z-index:50}
.md>div{background:var(--card);border:3px solid var(--navy);border-radius:10px;padding:20px;width:min(720px,100%)}
.md h3{margin:0 0 12px;color:var(--navy2);font:700 18px Georgia,serif}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:15px;color:var(--ink)}label input,label select{margin-top3px;margin-top:3px;color:var(--ink)}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pg button{background:var(--card);border:2px solid var(--navy);font-weight:700;border-radius:6px;padding:10px;text-align:left;color:var(--ink)}.pg button:hover{border-color:var(--navy2)}
.pg small{color:#111;display:block}
.ch{display:flex;align-items:flex-end;gap:14px;height:160px;padding-top:10px}.ch div{flex:1;text-align:center;font-size:12px;color:#111}
.ch i{display:inline-block;width:42%;background:var(--navy2);vertical-align:bottom;min-height:2px}.ch i.e{background:#d9a441}
.tot{text-align:right;margin-top:10px}.tot b{font-size:18px}
.em{color:#111;padding:18px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:6px;z-index:99;display:none}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px}.top{display:flex}.pos{grid-template-columns:1fr}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}aside,.top,main,.ac,.sm,#toast{display:none!important}.md{position:static;background:none;padding:0;display:block}.md>div{width:100%!important;border:0!important;padding:0!important;border-radius:0}}

/* ===== Documents sans défilement, bleu/blanc, mobile ===== */
.md.fit{padding:0;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;background:#0b1a10f5}
.md.fit>div{background:none;border:0;border-radius:0;padding:0;width:auto}
.md.fit>.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;overflow:hidden}
.shw{position:relative;flex:none}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#0b1a10;border-radius:6px;overflow:hidden;font:600 14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;box-shadow:0 6px 24px #0006}
.md.fit>.fb{background:var(--navy);margin:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:center;gap:6px}
.fb button{padding:9px 12px;font-size:14px;flex:1 1 auto;max-width:210px}
.fb .b{background:#fff;color:var(--navy);border-color:#fff}
.fb .b2{background:transparent;color:#fff;border-color:#fff}
.fb .b2.r{color:#ffb4ab;border-color:#ffb4ab}
.sh-h{background:#1a5632;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.sh-h .nm{font:700 22px/1.15 Georgia,serif}
.sh-h small{display:block;color:#d9eee0;font:500 12px/1.4 "Segoe UI",Arial,sans-serif;margin-top:3px}
.sh-t{text-align:right;flex:none}.sh-t b{display:block;font:700 22px/1.1 Georgia,serif;letter-spacing:1px}
.sh-b{padding:16px 22px 0}
.sh-cl{display:flex;justify-content:space-between;gap:10px;border:2px solid #1a5632;border-radius:6px;padding:8px 12px;margin-bottom:12px}
.sh-cl small{color:#3d4f43;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.sh-cl .cn{font-size:17px}
table.st{width:100%;border-collapse:collapse;border:0;min-width:0}
.st th{background:#b5560b;color:#fff;padding:7px 8px;text-align:left;font-size:12px;border:0;white-space:normal}
.st td{padding:7px 8px;border:0;border-bottom:1px solid #cfe0d3;background:#fff}
.st tr:nth-child(even) td{background:#eef1ee}
.st .r{text-align:right;white-space:nowrap}
.cp .st td{padding:3px 8px;font-size:13px}
.sh-tot{margin:12px 0 0 auto;width:58%;min-width:230px;border:2px solid #1a5632;border-radius:6px;overflow:hidden}
.sh-tot>div{display:flex;justify-content:space-between;gap:8px;padding:5px 12px}
.sh-tot .g{background:#1a5632;color:#fff;font:700 17px "Segoe UI",Arial,sans-serif}
.sh-f{border-top:3px solid #1a5632;margin:14px 22px 0;padding:10px 0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px}
.tkw{border-top:8px solid #1a5632;border-radius:0 0 6px 6px}
.tk{font:700 13px/1.45 "Courier New",monospace;color:#1a5632;padding:12px 14px 16px}
.tk .c{text-align:center}.tk .nm{font-size:18px}
.tk .sp{border-top:2px dashed #1a5632;margin:8px 0}
.tk .tt{background:#1a5632;color:#fff;padding:6px 8px;font-size:17px;display:flex;justify-content:space-between;margin-top:4px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px 120px 38px;gap:8px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #1a563266}
.ln .lt{font-weight:700;padding:10px 0;text-align:right}
@media(max-width:700px){
.sheet{font-size:13px}.sh-h{padding:14px 14px}.sh-h .nm{font-size:18px}.sh-t b{font-size:17px}.sh-b{padding:12px 14px 0}.sh-f{margin:12px 14px 0}.sh-tot{width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:640px;width:100%}
.tw th,.tw td{white-space:nowrap;padding:8px 10px;font-size:14px}
.tw td:last-child{display:table-cell}
.ln{grid-template-columns:1fr 1fr}.ln .a{grid-column:1/-1}.ln button{justify-self:end}
.pg{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media print{
.md.fit{display:block;position:static;height:auto;overflow:visible;background:none}
.md.fit>.stage{display:block;padding:0;overflow:visible}
.md.fit .shw{width:auto!important;height:auto!important;position:static}
.md.fit .sheet{position:static;transform:none!important;width:var(--pw,100%)!important;zoom:var(--pz,1);box-shadow:none;border-radius:0}
}

/* ===== Facture modèle vert / or / rouge ===== */
.fx{--g:#1a5632;--o:#b5560b;--y:#8a7a1e;--r:#9b1c1c;background:#fff;color:#0b1a10;min-height:1080px;padding:26px 40px 22px;display:flex;flex-direction:column;font:600 14px/1.4 "Segoe UI",system-ui,Arial,sans-serif;border-radius:0}
.fx .bands{display:block}.fx .bands i{display:block;height:5px;margin-bottom:3px}
.fx .bands i:nth-child(1){background:var(--g)}.fx .bands i:nth-child(2){background:var(--y)}.fx .bands i:nth-child(3){background:var(--r)}
.fx .bands.bt{margin-top:auto}
.fx .hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:14px 0 10px;border-bottom:3px solid var(--g)}
.fx .hl{display:flex;gap:14px;align-items:center;min-width:0}
.fx .hl img{max-height:72px;max-width:96px;border-radius:4px}
.fx .nm{font:800 25px/1.1 "Segoe UI",Arial,sans-serif;color:var(--g);text-transform:uppercase}
.fx .ad{font-weight:700;color:#0b1a10;margin-top:6px;font-size:14px}
.fx .hr{text-align:right;flex:none}
.fx .ti{font:800 28px/1 "Segoe UI",Arial,sans-serif;color:var(--g);letter-spacing:1px;text-transform:uppercase}
.fx .nu{font:800 17px/1.3 "Segoe UI",Arial,sans-serif;color:var(--o);margin-top:6px}
.fx .dt{font-weight:800;font-size:15px}
.fx .bd{display:inline-block;border:1.5px solid var(--g);color:var(--g);border-radius:4px;padding:1px 12px;font-weight:800;font-size:13px;margin-top:4px}
.fx .bx2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 14px}
.fx .bx{border:1.5px solid var(--g);border-radius:8px;padding:8px 12px;font-weight:700}
.fx .bx small{display:block;color:var(--g);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.fx .bx b{font-weight:800}
.fx .tbw{border:2px solid var(--g)}
.fx table.ft{width:100%;border-collapse:collapse;border:0;min-width:0}
.fx .ft th{background:var(--g);color:#fff;padding:7px 8px;font-size:13px;font-weight:800;text-transform:uppercase;text-align:left;border:0;border-right:1px solid #fff;white-space:nowrap}
.fx .ft th:last-child{border-right:0}
.fx .ft td{padding:4px 8px;border:0;border-right:1.5px solid #0b1a10;background:#fff;font-weight:700;font-size:14px;vertical-align:middle}
.fx .ft td:last-child{border-right:0}
.fx .ft tr.l:nth-child(even) td{background:#eef1ee}
.fx .ft .r{text-align:right;white-space:nowrap}.fx .ft .c{text-align:center}
.fx .ft td.rf{font-weight:800}
.fx .ft tr.fl td{padding:0}
.fx .bt2{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-top:14px;align-items:start}
.fx .let{border:1.5px solid var(--g);border-radius:8px;padding:8px 12px}
.fx .let small{display:block;color:var(--g);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.fx .let i{font-weight:700}
.fx .tt{border:2px solid var(--g);border-radius:8px;overflow:hidden}
.fx .tt>div{display:flex;justify-content:space-between;gap:8px;padding:5px 12px;font-weight:700}
.fx .tt .a{color:var(--o)}
.fx .tt .g{background:var(--g);color:#fff;font:800 17px "Segoe UI",Arial,sans-serif;text-transform:uppercase;padding:8px 12px}
.fx .tt .s{background:var(--o);color:#fff;font:800 16px "Segoe UI",Arial,sans-serif;text-transform:uppercase;padding:8px 12px}
.fx .sg{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 0 44px;color:var(--g);font-weight:800;font-size:13px;text-transform:uppercase}
.fx .sg div{border-bottom:2px solid #0b1a10;padding-bottom:30px;position:relative}
.fx .sg img{position:absolute;right:6px;bottom:2px;max-height:70px;max-width:150px}
.fx .ft2{border-top:3px solid var(--g);margin-top:18px;padding:10px 0 12px;display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:13px}
.fx .ft2 .m{color:var(--g);font-weight:800;margin-top:2px}
.fx .ft2 .rr{text-align:left;flex:none;max-width:38%}

/* liste des documents : toujours en tableau */
.tw.tbl{overflow-x:auto}
@media(max-width:700px){
.tw.tbl table{display:table!important;min-width:680px!important;border:2px solid var(--navy)!important;width:100%}
.tw.tbl table tbody{display:table-row-group!important}
.tw.tbl tr{display:table-row!important;border:0!important;border-radius:0!important;margin:0!important;padding:0!important}
.tw.tbl th,.tw.tbl td{display:table-cell!important;border:1px solid var(--navy)!important;padding:8px 10px!important;text-align:left!important;white-space:nowrap!important;font-size:15px}
.tw.tbl td::before{content:none!important}
.tw.tbl td:last-child{border-top:1px solid var(--navy)!important;margin:0!important}
}
/* ticket compact */
.tkw{border-top:0!important}
.tk{font:700 12px/1.35 "Courier New",monospace;color:#0b1a10;padding:10px 10px 12px;white-space:nowrap}
.tk .nm{font-size:15px;font-weight:800}
.tk .sp{border-top:1.5px dashed #0b1a10;margin:6px 0}
.tk .it{overflow:hidden;text-overflow:ellipsis}
.tk .tt{background:none;color:#0b1a10;padding:3px 0;font-size:15px;font-weight:800;border-top:2px solid #0b1a10;border-bottom:2px solid #0b1a10;margin:4px 0;display:flex;justify-content:space-between}

/* ===== Palette facture : vert / orange / or / rouge ===== */
aside{border-right:4px solid var(--y)}
aside h1{border-bottom:3px solid var(--o)}
aside a.on{border-left-color:var(--y)}
h2{border-bottom:4px solid var(--o);padding-bottom:6px;display:inline-block}
.kp div{border-top-color:var(--g)}
.kp div:nth-child(4n+2){border-top-color:var(--o)}
.kp div:nth-child(4n+3){border-top-color:var(--y)}
.kp div:nth-child(4n+4){border-top-color:var(--r)}
.b{background:var(--g);border-color:var(--g)}
.b:hover{background:var(--o);border-color:var(--o)}
.sm:hover,.b2:hover{border-color:var(--o);color:var(--o)}
th{background:var(--g);border-color:var(--g)}
.md h3{color:var(--g)}
.ch i{background:var(--g)}.ch i.e{background:var(--y)}
.top{border-bottom:4px solid var(--y)}
#toast{background:var(--g);border-left:5px solid var(--o)}
.fb .b{background:#fff;color:var(--g);border-color:#fff}
.fb .b:hover{background:var(--y);color:#fff}

/* ===== Ticket encadré ===== */
.tkw{background:#fff}
.tk2{margin:8px;border:2.5px solid var(--g);outline:1.5px solid var(--g);outline-offset:3px;border-radius:12px;overflow:hidden;background:#fff;color:#0b1a10;font:700 12px/1.4 "Segoe UI",system-ui,Arial,sans-serif;width:274px;position:relative;left:0}
.tk2 .tb{display:block;padding:0}.tk2 .tb i{display:block;height:5px}
.tk2 .tb i:nth-child(1){background:var(--g)}.tk2 .tb i:nth-child(2){background:var(--y)}.tk2 .tb i:nth-child(3){background:var(--r)}
.tk2 .th{text-align:center;padding:10px 10px 8px;border-bottom:2px solid var(--g)}
.tk2 .th img{max-width:90px;max-height:46px;display:block;margin:0 auto 4px}
.tk2 .tn{font-weight:800;color:var(--g);text-transform:uppercase;line-height:1.15}
.tk2 .ta{font-size:11px;margin-top:3px;color:#0b1a10}
.tk2 .tti{background:var(--g);color:#fff;text-align:center;font-weight:800;letter-spacing:2px;font-size:12px;padding:4px 0}
.tk2 .tin{margin:8px 8px 6px;border:1.5px solid var(--g);border-radius:8px;overflow:hidden}
.tk2 .tin div{display:flex;justify-content:space-between;gap:8px;padding:3px 10px}
.tk2 .tin div+div{border-top:1px dashed var(--g)}
.tk2 .tin span{color:var(--g);font-weight:800;text-transform:uppercase;font-size:11px}
.tk2 .tin b{font-weight:800;text-align:right}
.tk2 table.tit{width:calc(100% - 16px);margin:0 8px;border-collapse:collapse;min-width:0;border:1.5px solid var(--g)}
.tk2 .tit th{background:var(--o);color:#fff;font-size:11px;padding:4px 5px;border:1px solid var(--o);text-transform:uppercase;white-space:nowrap;text-align:left}
.tk2 .tit td{padding:4px 5px;border:1px solid var(--g);font-size:12px;background:#fff;white-space:normal;vertical-align:top}
.tk2 .tit tr:nth-child(even) td{background:#eef1ee}
.tk2 .tit .c{text-align:center}.tk2 .tit .r{text-align:right;white-space:nowrap}
.tk2 .tbx{margin:8px;border:2px solid var(--g);border-radius:8px;overflow:hidden}
.tk2 .tbx>div{display:flex;justify-content:space-between;gap:8px;padding:3px 10px}
.tk2 .tbx .gt{background:var(--g);color:#fff;font-weight:800;font-size:16px;padding:6px 10px}
.tk2 .tpy{margin:0 8px 8px;border:1.5px solid var(--g);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px}
.tk2 .tpy span{color:var(--g);font-weight:800;text-transform:uppercase;font-size:11px;margin-right:6px}
.tk2 .bdg{border:2px solid var(--o);color:var(--o);border-radius:6px;padding:1px 10px;font-weight:800;letter-spacing:1px}
.tk2 .tmg{margin:0 8px 10px;border:1.5px dashed var(--g);border-radius:8px;text-align:center;padding:6px 8px;color:var(--g);font-weight:800}
@media print{.tk2{margin:4px;width:auto}}

.pos.dx{grid-template-columns:1fr 400px}
.dl{border:1.5px solid var(--g);border-radius:8px;padding:8px;margin-top:8px;background:#fff}
.dl>input{font-weight:800;margin-bottom:6px}
.dr{display:grid;grid-template-columns:70px 1fr auto 38px;gap:8px;align-items:end}
.dr .lt{font-weight:800;padding:10px 0;text-align:right;white-space:nowrap}
@media(max-width:860px){.pos.dx{grid-template-columns:1fr}.dr{grid-template-columns:70px 1fr 38px}.dr .lt{grid-column:1/-1;text-align:right;order:5}}

.pg.pgp{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pg .pt{display:flex;flex-direction:column;gap:2px;padding:0 0 8px!important;overflow:hidden;text-align:left;border-color:var(--g)}
.pt img,.pt .ph{width:100%;height:100px;object-fit:cover;display:block;border-bottom:2px solid var(--g);margin-bottom:6px}
.pt .ph{background:var(--g);color:#fff;font:800 40px/100px Georgia,serif;text-align:center}
.pt>:not(img):not(.ph){margin:0 10px}
.pt b{line-height:1.2}
.pt .pr{color:var(--o);font-weight:800;font-size:18px}
.pt small{font-size:12px;color:var(--ink)}
.pt .lw{color:var(--r);font-weight:800}
.pg .pt:hover{border-color:var(--o);box-shadow:0 0 0 2px var(--o) inset}

ca=()=>sum(D.factures,f=>Math.min(num(f.total),paidOf(f))),dep=()=>sum(D.charges,c=>c.montant),stv=()=>sum(D.produits,p=>p.stock*p.pa),low=()=>D.produits.filter(p=>num(p.stock)<=num(p.seuil));

<h3 style="margin:18px 0 10px">Montants totaux de toutes les opérations</h3><div class="kp">${(()=>{const pr=D.prets||[],pa=pr.filter(x=>x.type=='Prêt accordé'),em=pr.filter(x=>x.type!='Prêt accordé'),t=k=>sum(D[k]||[],x=>x.total),C=(l,m,d)=>`<div><span>${l}</span><b>${fmt(m)}</b>${d?`<span style="font-size:13px;display:block;margin-top:4px">${d}</span>`:''}</div>`,nb=(k,w)=>(D[k]||[]).length+' '+w;

<div class="bar"><button class="b" onclick="go('vente')">Vente rapide</button><button class="b2" onclick="go('appro')">Ré-approvisionner</button></div>`;

V.factures=V.proforma=V.commandes=V.livraisons=k=>{const[t]=DOC[k];return`<h2>${t}s</h2><div class="bar"><input placeholder="Rechercher…" oninput="S.q=this.value;$('#tb').innerHTML=docRows('${k}')"><button class="b" onclick="openDoc('${k}')">+ Nouveau</button></div><div class="card" id="tb">${docRows(k)}</div>`};
function docRows(k){const q=S.q.toLowerCase(),r=D[k].filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice().reverse();if(!r.length)return`<div class="em">Aucun document pour le moment.</div>`;
return`<div class="tw tbl"><table><tr><th>N°</th><th>Date</th><th>${k=='commandes'?'Fournisseur':'Client'}</th><th>Total</th>${k=='factures'?'<th>Payé</th><th>Reste dû</th>':''}<th>Statut</th><th></th></tr>${r.map(x=>`<tr><td>${x.num}</td><td>${x.date}</td><td>${esc(x.tiers)}</td><td>${fmt(x.total)}</td>${k=='factures'?`<td>${fmt(Math.min(x.total,paidOf(x)))}</td><td>${fmt(Math.max(0,x.total-paidOf(x)))}${x.echeance&&x.total-paidOf(x)>0?`<br><small style="color:${x.echeance<today()?'var(--r)':'var(--o)'}">avant le ${x.echeance.split('-').reverse().join('/')}</small>`:''}</td>`:''}<td>${tag(x.statut)}</td><td style="white-space:nowrap"><button class="sm" onclick="viewDoc('${k}',${x.id})">Voir / PDF</button><button class="sm" onclick="openDoc('${k}',${x.id})">Modifier</button>${k=='proforma'?`<button class="sm" onclick="toFact(${x.id})">→ Facture</button>`:''}${k=='commandes'&&x.statut!='Reçu'?`<button class="sm" onclick="recv(${x.id})">Réceptionner</button>`:''}${k=='factures'?`<button class="sm pr" onclick="payModal(${x.id})">${x.total-paidOf(x)>0?'Paiement':'Versements'}</button>`:''}<button class="sm r" onclick="del('${k}',${x.id})">Supprimer</button></td></tr>`).join('')}</table></div>`}
function openDoc(k,id){const ex=id?D[k].find(x=>x.id==id):null;E=ex?JSON.parse(JSON.stringify(ex)):{lignes:[{n:'',q:1,pu:0}],statut:DOC[k][2][0]};E.k=k;const tl=k=='commandes'?'fournisseurs':'clients';
modal(`<h3>${ex?'Modifier':'Nouveau'} — ${DOC[k][0]}</h3><div class="g2"><label>Date<input id="d_date" type="date" value="${E.date||today()}"></label><label>${k=='commandes'?'Fournisseur':'Client'}<select id="d_tiers">${[...new Set([...D[tl].map(c=>c.nom),...(E.tiers?[E.tiers]:[])])].map(n=>`<option ${n==E.tiers?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Statut<select id="d_st">${DOC[k][2].map(s=>`<option ${s==E.statut?'selected':''}>${s}</option>`).join('')}</select></label>${k=='factures'?`<label>Acompte versé<input id="d_ac" type="number" min="0" placeholder="Auto" value="${E.acompte??''}"></label>`:''}</div><div id="lg" class="tw" style="margin-top:10px"></div><button class="b2" onclick="E.lignes.push({n:'',q:1,pu:0});lines()">+ Ligne</button><div id="tt" class="tot"></div><div class="ac"><button class="b2" onclick="closeM()">Annuler</button><button class="b" onclick="saveDoc()">Enregistrer</button></div>`);lines()}
const totals=l=>{const ht=sum(l,x=>x.q*x.pu),tv=0;return{ht,tv,ttc:ht}};
function lines(){const all=[...new Set([...D.produits.map(p=>p.nom),...D.services.map(s=>s.nom),...E.lignes.map(l=>l.n).filter(Boolean)])];$('#lg').innerHTML=E.lignes.map((l,i)=>`<div class="ln"><label class="a">Article<select onchange="pick(${i},this.value)"><option value="">— Libre —</option>${all.map(n=>`<option ${n==l.n?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Qté<input type="number" min="1" value="${l.q}" onchange="E.lignes[${i}].q=num(this.value);lines()"></label><label>Prix unitaire<input type="number" value="${l.pu}" onchange="E.lignes[${i}].pu=num(this.value);lines()"></label><div class="lt">${fmt(l.q*l.pu)}</div><button class="sm r" onclick="E.lignes.splice(${i},1);lines()">×</button></div>`).join('');const t=totals(E.lignes);$('#tt').innerHTML=`Total : <b>${fmt(t.ttc)}</b>`}
function pick(i,n){const l=E.lignes[i];l.n=n;const p=D.produits.find(x=>x.nom==n),s=D.services.find(x=>x.nom==n);if(p)l.pu=E.k=='commandes'?p.pa:p.pv;else if(s)l.pu=s.prix;lines()}

const rcvQ=(c,l)=>l.r!=null?num(l.r):(c.statut=='Reçu'?num(l.q):0);
const sLines=(k,x)=>k=='factures'?x.lignes.map(l=>({n:l.n,q:-num(l.q)})):k=='commandes'?x.lignes.map(l=>({n:l.n,q:rcvQ(x,l)})):[];
const recvAmt=c=>sum((c&&c.lignes)||[],l=>rcvQ(c,l)*num(l.pu));
const pendAmt=c=>(c.statut=='Annulé'||c.clos)?0:Math.max(0,num(c.total)-recvAmt(c));
function mkNum(k){D.seq[k]=(D.seq[k]||0)+1;return DOC[k][1]+'-'+new Date().getFullYear()+'-'+String(D.seq[k]).padStart(4,'0')}
function saveDoc(){const k=E.k;E.date=$('#d_date').value;E.tiers=$('#d_tiers').value;E.statut=$('#d_st').value;E.total=totals(E.lignes).ttc;
if(k=='commandes'){if(E.statut=='Reçu'&&!E.clos)E.lignes.forEach(l=>l.r=num(l.q));else if(E.statut!='Reçu'){E.clos=false;if(E.statut!='Annulé'){const tr=sum(E.lignes,l=>rcvQ(E,l));if(tr>0)E.statut=E.lignes.every(l=>rcvQ(E,l)>=num(l.q))?'Reçu':'Partielle'}}}
if(k=='factures'){const a=$('#d_ac').value;E.acompte=a===''?null:num(a)}
if(E.id){const i=D[k].findIndex(x=>x.id==E.id),o=D[k][i];takeStock(sLines(k,o),-1);D[k][i]=E;takeStock(sLines(k,E),1)}else{E.id=nid();E.num=mkNum(k);D[k].push(E);takeStock(sLines(k,E),1)}
save();closeM();go(k);toast('Document enregistré')}
function toFact(id){const p=D.proforma.find(x=>x.id==id),f={...JSON.parse(JSON.stringify(p)),id:nid(),num:mkNum('factures'),statut:'Impayée',date:today()};D.factures.push(f);takeStock(f.lignes,-1);p.statut='Acceptée';save();go('factures');toast('Facture créée')}
function recv(id){const c=D.commandes.find(x=>x.id==id);if(!c)return;
const G='display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 78px;gap:6px;align-items:center;padding:6px 2px;border-bottom:1px solid #cfd8d2',rows=c.lignes.map((l,i)=>{const done=rcvQ(c,l),rest=Math.max(0,num(l.q)-done);return`<div style="${G}"><div style="overflow-wrap:anywhere;line-height:1.2">${esc(l.n)}</div><div style="text-align:center">${num(l.q)}</div><div style="text-align:center">${done}</div><input type="number" id="rc_${i}" min="0" value="${rest}" style="width:100%;padding:6px 4px;text-align:center"></div>`}).join('');
modal(`<h3>Réceptionner — ${esc(c.num)}</h3><div>Saisissez la quantité réellement reçue pour chaque article. Si elle est inférieure à la quantité commandée, le bon passe en « Partielle » et vous pourrez réceptionner le reste plus tard.</div><div style="margin-top:8px"><div style="${G};font-size:12px;color:var(--navy);border-bottom:2px solid var(--navy)"><div>Article</div><div style="text-align:center">Cmd</div><div style="text-align:center">Reçu</div><div style="text-align:center">Maintenant</div></div>${rows}</div><label style="margin-top:10px">Dépôt de réception<select id="rc_dep"><option value="">Dépôt principal de chaque produit</option>${(D.depots||[]).map(d=>`<option value="${d.id}">${esc(d.nom)}</option>`).join('')}</select></label><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="rc_close" style="width:auto"> Le reste ne sera pas livré : clôturer ce bon</label><div class="ac"><button class="b2" onclick="closeM()">Annuler</button><button class="b" onclick="recvSave(${id})">Valider la réception</button></div>`)}
function recvSave(id){if(!can('commandes','modifier'))return deny();const c=D.commandes.find(x=>x.id==id);if(!c)return;
const add=c.lignes.map((l,i)=>Math.max(0,num($('#rc_'+i).value)));
if(!add.some(q=>q>0)&&!$('#rc_close').checked){toast('Saisissez au moins une quantité reçue');return}
const before=c.lignes.map(l=>rcvQ(c,l));
c.lignes.forEach((l,i)=>{l.r=before[i]+add[i];if(add[i]>0){takeStock([{n:l.n,q:add[i]}],1);dIn(l.n,add[i],$('#rc_dep')&&$('#rc_dep').value)}});
const full=c.lignes.every(l=>num(l.r)>=num(l.q)),close=$('#rc_close').checked;
c.clos=!full&&close;c.statut=full||close?'Reçu':'Partielle';
const det=c.lignes.map((l,i)=>add[i]>0?add[i]+' × '+l.n:'').filter(Boolean).join(', ');
save();jlog('Réception','Bon de commande '+c.num+' : '+(det||'aucune quantité')+(c.statut=='Reçu'?(c.clos?' — clôturé avec reste non livré':' — complet'):' — réception partielle'),{tn:c.tiers,ref:c.num});
closeM();go('commandes');toast(c.statut=='Reçu'?'Commande réceptionnée':'Réception partielle enregistrée')}
function viewDoc(k,id){const x=D[k].find(d=>d.id==id),t=totals(x.lignes);modal(`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3 style="margin:0">${esc(D.set.nom)}</h3>${esc(D.set.adr)}<br>${esc(D.set.tel)}</div><div style="text-align:right"><b>${DOC[k][0]} ${x.num}</b><br>Date : ${x.date}<br>${k=='commandes'?'Fournisseur':'Client'} : ${esc(x.tiers)}</div></div><div class="tw" style="margin-top:14px"><table><tr><th>Article</th><th>Qté</th><th>PU</th><th>Total</th></tr>${x.lignes.map(l=>`<tr><td>${esc(l.n||'Article libre')}</td><td>${l.q}</td><td>${fmt(l.pu)}</td><td>${fmt(l.q*l.pu)}</td></tr>`).join('')}</table></div><div class="tot">Total : <b>${fmt(t.ttc)}</b></div><div class="ac"><button class="b2" onclick="closeM()">Fermer</button><button class="b" onclick="window.print()">Imprimer</button></div>`)}

function loadJs(u){return new Promise((ok,ko)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>ko(new Error('chargement'));document.head.appendChild(e)})}
async function pdfLibs(){
if(!window.html2canvas)await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
if(!(window.jspdf&&window.jspdf.jsPDF))await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}
async function pdfFrom(el,w,name,mode){
await pdfLibs();
const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0;background:#fff;z-index:-1';
const c=el.cloneNode(true);c.style.position='static';c.style.transform='none';c.style.boxShadow='none';c.style.borderRadius='0';c.style.width=w+'px';c.style.background='#fff';
host.appendChild(c);document.body.appendChild(host);
await new Promise(r=>setTimeout(r,120));
let cv;try{cv=await html2canvas(c,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false})}finally{host.remove()}
const J=window.jspdf.jsPDF;let pdf;
if(mode=='tk'){const h=80*cv.height/cv.width;pdf=new J({unit:'mm',format:[80,Math.max(h,40)]});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,80,h)}
else{
const land=mode=='land',PW=land?297:210,PH=land?210:297,M=8,iw=PW-2*M,ph=PH-2*M;
pdf=new J({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});
const pxPage=Math.floor(cv.width*ph/iw);let y=0,first=true;
while(y<cv.height){const hh=Math.min(pxPage,cv.height-y),sl=document.createElement('canvas');sl.width=cv.width;sl.height=hh;
const g=sl.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sl.width,hh);g.drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh);
if(!first)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.95),'JPEG',M,M,iw,hh*iw/cv.width);first=false;y+=hh}}
return pdf}
async function pdfSave(pdf,name){
const fn=(name||'document').replace(/[\\/:*?"<>|]+/g,'-').trim()+'.pdf',blob=pdf.output('blob');
try{const f=new File([blob],fn,{type:'application/pdf'});
if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:fn});return}catch(e){if(e&&e.name=='AbortError')return}}}catch(e){}
const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}

<script>
/* v8.1 : barre de recherche sur les listes de clients, fournisseurs et produits */
(function(){
const IDS={pc:'client',d_tiers:'client / fournisseur',da_p:'produit',dt_p:'produit',ab_p:'produit'};
const nz=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function enh(sel){
 if(sel.dataset.sr)return;sel.dataset.sr='1';
 let all=[...sel.options].map(o=>o.cloneNode(true)),self=false;
 const mo=new MutationObserver(()=>{if(self)return;all=[...sel.options].map(o=>o.cloneNode(true));inp.value='';msg.style.display='none'});mo.observe(sel,{childList:true});
 const inp=document.createElement('input');inp.type='search';inp.className='srch';
 inp.placeholder='🔍 Rechercher un '+IDS[sel.id]+'…';inp.autocomplete='off';
 const msg=document.createElement('small');msg.className='srm';msg.textContent='Aucun résultat';msg.style.display='none';
 sel.parentNode.insertBefore(inp,sel);sel.parentNode.insertBefore(msg,sel.nextSibling);
 inp.addEventListener('click',e=>e.preventDefault());
 inp.oninput=()=>{
  const q=nz(inp.value),cur=sel.value,keep=all.filter(o=>!q||nz(o.textContent).includes(q));
  if(!keep.length){msg.style.display='block';return}
  msg.style.display='none';
  self=true;sel.innerHTML='';keep.forEach(o=>sel.appendChild(o.cloneNode(true)));setTimeout(()=>self=false,0);
  const still=keep.some(o=>o.value==cur);
  sel.value=still?cur:keep[0].value;
  if(!still)sel.dispatchEvent(new Event('change',{bubbles:true}));
 };
}
function scan(root){(root||document).querySelectorAll('select').forEach(s=>{if(IDS[s.id])enh(s)})}
new MutationObserver(m=>{for(const r of m)for(const n of r.addedNodes)if(n.nodeType==1){if(n.tagName=='SELECT'&&IDS[n.id])enh(n);else scan(n)}}).observe(document.body,{childList:true,subtree:true});
scan();
})();
